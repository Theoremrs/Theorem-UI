[package]
name = "theorem-workbench-panels"
version = "0.1.0"
edition = "2024"
publish = false
description = "Child panels of the Theo Web terminal workbench, written against the interaction core's Panel trait: Files today"

[dependencies]
theorem-workbench-core = { path = "../workbench-core" }
ratatui = { version = "0.30.1", default-features = false }
serde_json = "1"
# The inline rename and new-name rows: a text buffer with a cursor and word motions.
# Default features pull crossterm; the key mapping is ours.
tui-input = { version = "0.15.5", default-features = false }
# KeyInput, Key and Mods in PanelMsg::Key.
keybinds = "0.2"

[dev-dependencies]
theorem-workbench-dock = { path = "../workbench-dock" }
serde_json = "1"
