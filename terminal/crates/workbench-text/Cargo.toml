[package]
name = "theorem-workbench-text"
version = "0.1.0"
edition = "2024"
publish = false
description = "Text coordinates and the shared editing session for the Theo Web terminal workbench"

[dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines"] }
operational-transform = "0.6.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
# KeyInput, Key and Mods: the keys a one-line field takes.
keybinds = "0.2"
ratatui = { version = "0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
