[package]
name = "theorem-workbench-changes"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The Changes (source control) model and view for the Theo Web terminal workbench, translated from the ELY Git panel"

[dependencies]
theorem-workbench-core = { path = "../workbench-core" }
ratatui = { version = "0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
# Word-level marks inside a changed line, as the donor's `mark_words` does. Default features
# are off but `std` and `unicode` (word segmentation); no deadline is set, so `Instant::now`
# is never called and the `wasm32_web_time` feature (which pulls wasm-bindgen) is not needed.
similar = { version = "3.2.1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
serde_json = "1"
