[package]
name = "theorem-workbench-editor"
version = "0.1.0"
edition = "2024"
publish = false
description = "The source editor panel of the Theo Web terminal workbench: an editing widget over the shared text session, and the document panel that sends its edits to the owner"

[dependencies]
theorem-workbench-core = { path = "../workbench-core" }
theorem-workbench-text = { path = "../workbench-text" }
ratatui = { version = "0.30.1", default-features = false }
serde_json = "1"
# The find field and the rename field: a text buffer with a cursor and word motions.
tui-input = { version = "0.15.5", default-features = false }
# KeyInput, Key and Mods in PanelMsg::Key.
keybinds = "0.2"
# Word boundaries for double click; the same algorithm the text session uses for word motion.
unicode-segmentation = "1.13"
# Cell widths of the find field and the strip text.
unicode-width = "0.2"
# The Markdown of a hover answer, drawn as styled lines.
tui-markdown = { version = "0.3.12", default-features = false }
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines"] }

[dev-dependencies]
theorem-workbench-dock = { path = "../workbench-dock" }
theorem-workbench-panels = { path = "../workbench-panels" }
serde_json = "1"
unicode-width = "0.2"
