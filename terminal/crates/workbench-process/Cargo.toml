[package]
name = "theorem-workbench-process"
version = "0.1.0"
edition = "2024"
publish = false
description = "The process (shell) pane of the Theo Web terminal workbench: choose, attach or open, control, observe and detach, written against the interaction core's Panel trait"

[dependencies]
theorem-workbench-core = { path = "../workbench-core" }
theorem-workbench-vt = { path = "../workbench-vt" }
ratatui = { version = "0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# KeyInput, Key and Mods in PanelMsg::Key.
keybinds = "0.2"
# The key and mouse events the VT encoders take; keybinds has no conversion to them.
terminput = "0.5.16"
base64 = "0.22"

[dev-dependencies]
theorem-workbench-dock = { path = "../workbench-dock" }
