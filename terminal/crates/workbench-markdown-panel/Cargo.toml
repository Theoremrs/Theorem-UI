[package]
name = "theorem-workbench-markdown-panel"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Markdown panel of the Theo Web terminal workbench: Visual, Source, Split and Preview over one document session, its edits sent to the document owner"

[dependencies]
theorem-workbench-core = { path = "../workbench-core" }
theorem-workbench-markdown = { path = "../workbench-markdown" }
theorem-workbench-editor = { path = "../workbench-editor" }
theorem-workbench-text = { path = "../workbench-text" }
ratatui = { version = "0.30.1", default-features = false }
serde_json = "1"
# KeyInput, Key and Mods in PanelMsg::Key.
keybinds = "0.2"
# Cell widths of the strip text.
unicode-width = "0.2"
# A link target is percent-encoded text of a path.
percent-encoding = "2"
# The anchor a heading has, as GitHub makes it (duplicates numbered).
github-slugger = "0.1"

[dev-dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines"] }
theorem-workbench-dock = { path = "../workbench-dock" }
theorem-workbench-panels = { path = "../workbench-panels" }
serde_json = "1"
unicode-width = "0.2"
