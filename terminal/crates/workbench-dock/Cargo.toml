[package]
name = "theorem-workbench-dock"
version = "0.1.0"
edition = "2024"
publish = false
description = "The one layout owner for the Theo Web workbench: tab groups over a split tree, solved in terminal cells"

[dependencies]
theorem-workbench-layout = { path = "../workbench-layout" }
ratatui = { version = "0.30.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
