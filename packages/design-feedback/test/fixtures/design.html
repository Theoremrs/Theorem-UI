<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Feedback fixture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #191919; background: #fff; font: 16px/1.5 Arial, sans-serif; }
  main { max-width: 720px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  /* Explicit paragraph paint keeps this contrast fixture measurable even
     while its wide box intentionally overflows the body's painted bounds. */
  #summary { color: #aaa; background: #fff; font-size: 14px; width: 760px; }
  #action { width: 16px; height: 16px; padding: 0; font-size: 10px; border: 0; color: #111; background: #ddd; }
  #clipped { height: 24px; overflow: hidden; }
  #entrance { animation: enter 60s both; }
  .spinner { width: 20px; height: 20px; background: #444; animation: spin 2s linear infinite; }
  .fixed #summary { width: auto; max-width: 100%; color: #222; font-size: 16px; }
  .fixed #action { width: auto; min-width: 100px; height: 44px; padding: 8px 16px; font-size: 16px; color: #fff; background: #174ea6; }
  .fixed #clipped { height: auto; overflow: visible; }
  @keyframes enter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
<main>
  <h1 data-design-id="title">A measurable design change</h1>
  <p id="summary" data-design-id="summary">This paragraph should remain readable and fit the viewport when the interface is narrowed.</p>
  <button id="action" data-design-id="action">Go</button>
  <p id="clipped" data-design-id="clipped">Text spacing should preserve this paragraph, including all the words on its second line.</p>
  <p id="entrance" data-design-id="entrance">Finite entrance animations finish before static capture.</p>
  <div class="spinner" aria-label="Animation sample"></div>
</main>
<script>if (new URLSearchParams(location.search).get('variant') === 'fixed') document.body.classList.add('fixed')</script>
</html>
