<!doctype html>
<html lang="en" data-embed>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scene</title>
<style>
  :root {
    --ink: #2A2823;
    --ink-soft: #6b665c;
    --paper: #f4f1ea;
    --paper-soft: #ece8df;
    --rule: #d9d4c8;
    --accent: #b45a2d;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { display: flex; flex-direction: column; font-family: var(--mono); }
  header {
    border-bottom: 1px solid var(--rule); background: var(--paper-soft);
    padding: 13px 22px 12px;
  }
  .eyebrow {
    margin: 0 0 6px; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .titlerow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  #scene-title { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink); }
  #scene-meta { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.02em; }
  #scene-note {
    display: none; margin-top: 8px; font-size: 11px; color: var(--accent);
    line-height: 1.45;
  }
  #scene-stage { position: relative; flex: 1; min-height: 0; }
  #scene-canvas { display: block; width: 100%; height: 100%; }
  /* The d3-annotation explanation layer sits over the canvas. pointer-events
     are off so it never intercepts the canvas hover / click hit-testing. */
  #scene-annotations {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4; overflow: visible;
  }
  #scene-annotations .annotation-note-title {
    font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--ink);
  }
  #scene-annotations .annotation-note-label {
    font-family: var(--mono); font-size: 10px; fill: var(--ink-soft);
  }
  #scene-annotations .annotation path,
  #scene-annotations .annotation line { stroke: var(--accent); }
  /* The one action a selection callout carries (src/renderer/annotationLayer.ts):
     a button under the note, placed by the layer. */
  .scene-callout-action {
    position: absolute; z-index: 5; min-height: 24px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--paper-soft); color: var(--ink);
    font-family: var(--mono); font-size: 11px; line-height: 16px; white-space: nowrap; cursor: pointer;
  }
  .scene-callout-action:hover { border-color: var(--accent); }
  #scene-empty {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; color: var(--ink-soft); font-size: 13px; line-height: 1.6;
    max-width: 480px; margin: 0 auto;
  }
  #scene-empty strong {
    display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px;
  }
  #scene-tooltip {
    position: absolute; pointer-events: none; display: none; max-width: 320px;
    padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--paper-soft); font-size: 11px; line-height: 1.45;
    color: var(--ink); box-shadow: 0 4px 14px rgba(42, 40, 35, 0.12); z-index: 5;
  }
  #scene-tooltip .tip-title { color: var(--ink); font-weight: 600; word-break: break-word; }
  #scene-tooltip .tip-kind {
    color: var(--accent); margin-top: 3px; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #scene-tooltip .tip-src { color: var(--ink-soft); margin-top: 3px; }
  form.scene-search { display: flex; gap: 8px; align-items: stretch; margin-bottom: 11px; }
  form.scene-search input {
    flex: 1; min-width: 0; border: 1.5px solid var(--rule); border-radius: 7px;
    background: var(--paper); color: var(--ink); font-family: var(--mono);
    font-size: 15px; padding: 8px 12px; outline: none;
  }
  form.scene-search input:focus { border-color: var(--accent); }
  form.scene-search button {
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--paper);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 0 16px; border-radius: 7px; cursor: pointer;
  }
  form.scene-search button:hover { background: #9c4a22; }

  /* ---------------------------------------------------------------------
     Explanation mode: the interactive cell view, on Sunset Dock 1.0
     (DESIGN.md sections 5, 7-10). Only applies when the bundle mounts an
     explanation package and sets data-mode="explain" on <html>.
     --------------------------------------------------------------------- */
  #explain-root { display: none; }
  [data-mode="explain"] {
    --ex-text: #FADDD1;
    --ex-secondary: #C6B4AD;
    --ex-tertiary: #B3A6A0;
    --ex-ink: #CAB9B1;
    --ex-teal: #47E0FF;
    --ex-amber: #EDD559;
    --ex-error: #ED5959;
    --ex-success: #59ED7A;
    --ex-rule: rgba(255, 255, 255, 0.08);
    --ex-edge: rgba(255, 255, 255, 0.12);
    --ex-hover: rgba(255, 255, 255, 0.045);
    --ex-pressed: rgba(255, 255, 255, 0.07);
    --ex-selected: rgba(71, 224, 255, 0.075);
    --ex-surface: #2A2B2B;
    --ex-well: rgba(0, 0, 0, 0.18);
    --ex-human: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ex-agent: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ex-meta: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    /* Behind diagram labels so lattice cells and wires never cross the text. */
    --ex-halo: rgba(44, 42, 41, 0.92);
    --ex-page: #2C2A29;
    --ex-page-wash: linear-gradient(180deg, #32251F 0%, #252F33 100%);
    --ex-scheme: dark;
    --ex-icon-hover: #333434;
    --ex-option: #2A2B2B;
    --ex-scrollbar: rgba(255, 255, 255, 0.16);
    --ex-primary-edge: rgba(71, 224, 255, 0.55);
    background: var(--ex-page);
    /* Native controls, menus and scrollbars draw dark on the field, or as
       the host's theme says (src/theme.ts sets these on the root). */
    color-scheme: var(--ex-scheme);
  }
  [data-mode="explain"] body {
    background: var(--ex-page-wash) var(--ex-page) fixed;
    color: var(--ex-text);
    font-family: var(--ex-human);
  }
  [data-mode="explain"] #scene-header,
  [data-mode="explain"] #scene-stage { display: none; }
  [data-mode="explain"] #explain-root {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }
  /* Zero specificity, so each control's own class sets its size (13 du). */
  :where([data-mode="explain"]) :where(button, select, input) { font: inherit; color: inherit; }
  [data-mode="explain"] :focus-visible { outline: 2px solid var(--ex-teal); outline-offset: 2px; }
  .ex-header { padding: 12px 16px 10px; background: none; border-bottom: 1px solid var(--ex-rule); }
  .ex-eyebrow {
    margin: 0 0 4px; font-family: var(--ex-meta); font-size: 12px; color: var(--ex-tertiary);
  }
  .ex-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 22px; }
  .ex-summary { margin: 2px 0 0; font-size: 13px; color: var(--ex-secondary); line-height: 18px; }
  .ex-note {
    display: none; margin: 8px 0 0; padding-left: 8px; border-left: 2px solid var(--ex-amber);
    font-size: 12px; line-height: 17px; color: var(--ex-secondary);
  }
  .ex-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 336px; }
  .ex-stage { position: relative; overflow: hidden; min-height: 0; }
  .ex-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: grab;
  }
  .ex-canvas.is-dragging { cursor: grabbing; }
  .ex-canvas:focus-visible { outline-offset: -2px; }
  .ex-labels {
    position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none;
    transform-origin: 0 0;
  }
  /* Padding, line height and gaps mirror src/explain/labels.ts, which decides
     what fits; a label shows whole or not at all. */
  .ex-label {
    position: absolute; box-sizing: border-box; overflow: hidden; display: flex;
    flex-direction: column; gap: 1px; padding: 5px 7px; white-space: nowrap;
    font-size: 12px; line-height: 15px; color: var(--ex-text);
    text-shadow: 0 0 2px var(--ex-halo), 0 0 4px var(--ex-halo), 0 0 6px var(--ex-halo);
  }
  .ex-label > span { flex: none; }
  .ex-label.is-inline { flex-direction: row; align-items: baseline; gap: 6px; }
  .ex-label.is-wrapped .ex-label-name { white-space: normal; }
  .ex-label.is-above { padding: 2px 1px; overflow: visible; }
  .ex-label.is-row {
    flex-direction: row; align-items: center; justify-content: space-between;
    gap: 6px; padding: 0 5px; font-size: 11px; line-height: 13px;
  }
  .ex-label-name { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .ex-label.is-row .ex-label-name { font-weight: 500; color: var(--ex-secondary); }
  .ex-label-value {
    overflow: hidden; text-overflow: ellipsis; font-family: var(--ex-meta);
    font-size: 11px; color: var(--ex-secondary); font-variant-numeric: tabular-nums;
  }
  .ex-label.is-selected .ex-label-name { color: var(--ex-text); }
  /* The agent's eyes are drawn on the canvas in the 72px gutter to the left. */
  .ex-narration {
    position: absolute; left: 72px; bottom: 16px; box-sizing: border-box;
    width: min(560px, calc(100% - 88px)); padding: 12px 14px;
    background: var(--ex-surface); border: 1px solid var(--ex-rule); border-radius: 8px;
  }
  .ex-voice {
    margin: 0; min-height: 44px; font-family: var(--ex-agent); font-size: 15px; line-height: 22px;
    color: var(--ex-text);
  }
  .ex-walk { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .ex-walk-position { flex: 1; font-size: 12px; color: var(--ex-tertiary); }
  /* The picked part's callout, when a host offers an action on it. The halo
     keeps the note legible over cells and wires, as it does for labels. */
  .ex-callouts {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible;
  }
  .ex-callouts .annotation-note-title, .ex-callouts .annotation-note-label {
    font-family: var(--ex-human); paint-order: stroke; stroke: var(--ex-halo); stroke-width: 4px;
    stroke-linejoin: round;
  }
  .ex-callouts .annotation-note-title { font-size: 12px; font-weight: 600; fill: var(--ex-text); }
  .ex-callouts .annotation-note-label { font-size: 11px; fill: var(--ex-secondary); }
  .ex-callouts .annotation path, .ex-callouts .annotation line { stroke: var(--ex-teal); }
  [data-mode="explain"] .scene-callout-action {
    z-index: auto; min-height: 28px; padding: 0 10px; border-color: var(--ex-primary-edge);
    background: var(--ex-surface); color: var(--ex-text); font-family: var(--ex-human);
    font-size: 12px; transition: background-color 100ms;
  }
  [data-mode="explain"] .scene-callout-action:hover { background: var(--ex-icon-hover, var(--ex-surface)); border-color: var(--ex-teal); }
  .ex-stage-tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; }
  .ex-icon-button {
    min-width: 28px; height: 28px; padding: 0 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ex-edge); background: var(--ex-surface); color: var(--ex-ink);
    font-size: 13px; transition: background-color 100ms;
  }
  .ex-icon-button:hover { background: var(--ex-icon-hover); }
  .ex-panel {
    overflow: auto; border-left: 1px solid var(--ex-rule); padding: 12px 16px 24px;
    scrollbar-width: thin; scrollbar-color: var(--ex-scrollbar) transparent;
    scrollbar-gutter: stable;
  }
  .ex-section { margin: 0 0 18px; }
  .ex-section-title {
    margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ex-secondary);
  }
  .ex-subtitle { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--ex-tertiary); }
  .ex-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .ex-row > .ex-button { flex: 1 1 auto; }
  .ex-button, .ex-chip, .ex-segment {
    min-height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--ex-edge); background: transparent; color: var(--ex-text);
    font-size: 13px; line-height: 18px; transition: background-color 100ms, border-color 100ms;
  }
  .ex-button:hover, .ex-chip:hover, .ex-segment:hover { background: var(--ex-hover); }
  .ex-button:active, .ex-chip:active, .ex-segment:active { background: var(--ex-pressed); }
  .ex-primary { border-color: var(--ex-primary-edge); background: var(--ex-selected); }
  .ex-button:disabled, .ex-chip:disabled { opacity: 0.5; cursor: not-allowed; }
  .ex-link {
    margin: 6px 0 0; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--ex-secondary); font-size: 12px; text-decoration: underline;
    text-underline-offset: 2px;
  }
  .ex-field { display: grid; gap: 4px; margin: 0 0 8px; }
  .ex-field-label { font-size: 12px; color: var(--ex-tertiary); }
  .ex-select, .ex-input {
    height: 28px; box-sizing: border-box; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--ex-edge); background: var(--ex-well); color: var(--ex-text);
    font-size: 13px; min-width: 0;
  }
  .ex-select option { background: var(--ex-option); color: var(--ex-text); }
  .ex-input { font-family: var(--ex-meta); font-variant-numeric: tabular-nums; text-align: right; }
  .ex-input[aria-invalid="true"] { border-color: var(--ex-error); }
  .ex-phases { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .ex-phase {
    height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--ex-rule);
    font-family: var(--ex-meta); font-size: 11px; line-height: 22px; color: var(--ex-tertiary);
  }
  .ex-phase.is-done { color: var(--ex-secondary); }
  .ex-phase.is-done::before { content: "✓ "; }
  .ex-phase.is-next { color: var(--ex-text); border-color: var(--ex-teal); background: var(--ex-selected); }
  .ex-phase.is-next::before { content: "▸ "; }
  .ex-phase.is-fault { color: var(--ex-text); border-color: var(--ex-error); }
  .ex-phase.is-fault::before { content: "! "; }
  .ex-chips { display: flex; flex-direction: column; gap: 6px; }
  .ex-chip { text-align: left; padding: 6px 10px; }
  /* Each option takes the width its label needs and rows fill the panel, so
     no label wraps while its neighbours stay on one line. */
  .ex-segmented { display: flex; flex-wrap: wrap; gap: 4px; }
  .ex-segmented > .ex-segment { flex: 1 1 auto; }
  .ex-segment { padding: 4px 8px; text-align: center; color: var(--ex-secondary); }
  .ex-segment.is-selected {
    color: var(--ex-text); background: var(--ex-selected); border-color: var(--ex-teal);
  }
  .ex-inspector { display: grid; gap: 6px; }
  .ex-inspect-title { margin: 0; font-size: 14px; font-weight: 600; }
  .ex-meta { margin: 0; font-size: 12px; color: var(--ex-tertiary); }
  .ex-description { margin: 0; font-size: 13px; line-height: 19px; color: var(--ex-secondary); }
  .ex-inspect-value {
    margin: 0; font-family: var(--ex-meta); font-size: 12px; color: var(--ex-text);
    overflow-wrap: anywhere;
  }
  .ex-muted { margin: 0; font-size: 12px; color: var(--ex-tertiary); }
  /* One grid for every port so the width and value columns line up, and the
     value column as wide as its longest value: a 32-bit value never cuts. */
  .ex-ports {
    list-style: none; margin: 0; padding: 0; display: grid; gap: 2px 8px;
    grid-template-columns: minmax(0, 1fr) auto minmax(72px, max-content);
  }
  .ex-port {
    display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; font-size: 12px;
    line-height: 20px; color: var(--ex-secondary);
  }
  .ex-port-name { min-width: 0; overflow-wrap: anywhere; }
  .ex-port-width { color: var(--ex-tertiary); font-family: var(--ex-meta); font-size: 11px; }
  .ex-port-value {
    text-align: right; font-family: var(--ex-meta); font-size: 11px; color: var(--ex-text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ex-registers { display: grid; gap: 4px; }
  .ex-register { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 8px; align-items: center; }
  .ex-register-name { font-family: var(--ex-meta); font-size: 12px; color: var(--ex-secondary); }
  .ex-register.is-changed .ex-input { border-color: var(--ex-text); }
  .ex-register-error { grid-column: 2; font-size: 11px; color: var(--ex-error); }
  .ex-register-error:empty { display: none; }
  .ex-memory { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .ex-word { display: flex; justify-content: space-between; gap: 8px; }
  .ex-word-value { font-family: var(--ex-meta); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ex-checks, .ex-assumptions { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .ex-check { display: grid; gap: 1px; }
  .ex-check-state { font-family: var(--ex-meta); font-size: 11px; }
  .ex-check.is-pass .ex-check-state { color: var(--ex-success); }
  .ex-check.is-fail .ex-check-state { color: var(--ex-error); }
  .ex-check.is-unknown { font-size: 12px; color: var(--ex-tertiary); }
  .ex-check-label { font-size: 13px; line-height: 18px; color: var(--ex-secondary); }
  .ex-check-detail { font-size: 12px; color: var(--ex-text); }
  .ex-assumption { font-size: 12px; line-height: 17px; color: var(--ex-tertiary); padding-left: 10px; border-left: 1px solid var(--ex-rule); }
  .ex-status { margin: 0; font-size: 12px; color: var(--ex-secondary); }
  .ex-visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  [data-mode="explain"] [data-busy] .ex-stage { cursor: progress; }
  @media (max-width: 860px) {
    [data-mode="explain"] #explain-root { overflow: auto; }
    .ex-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 64vh) auto; }
    .ex-panel { border-left: 0; border-top: 1px solid var(--ex-rule); overflow: visible; }
  }
  @media (pointer: coarse) {
    .ex-button, .ex-chip, .ex-segment, .ex-icon-button, .ex-select, .ex-input, .ex-link { min-height: 44px; }
    .scene-callout-action, [data-mode="explain"] .scene-callout-action { min-height: 44px; }
    .ex-icon-button { min-width: 44px; }
    .ex-stage-tools { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ex-button, .ex-chip, .ex-segment, .ex-icon-button, [data-mode="explain"] .scene-callout-action { transition: none; }
  }

  /* ---------------------------------------------------------------------
     In a host's frame (src/embed.ts). Inline in a reply the page shows the
     diagram and its walkthrough; the host's Expand switches to the full
     layout with the panel. Only CSS changes, so the scene keeps its state.
     --------------------------------------------------------------------- */
  [data-embed] form.scene-search { display: none; }
  [data-layout="inline"] #explain-root { overflow: hidden; }
  [data-layout="inline"] .ex-body {
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  /* The panel leaves the layout; its status line stays for screen readers. */
  [data-layout="inline"] .ex-panel {
    position: absolute; width: 1px; height: 1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  [data-layout="inline"] .ex-panel > :not(.ex-status) { display: none; }
</style>
</head>
<body>
  <header id="scene-header">
    <form class="scene-search" action="/scene" method="get" autocomplete="off">
      <input id="scene-q" name="q" type="search" placeholder="Search your substrate…" aria-label="Search your substrate" />
      <button type="submit">Search</button>
    </form>
    <p class="eyebrow">Scene</p>
    <div class="titlerow">
      <h1 id="scene-title">Scene</h1>
      <span id="scene-meta"></span>
    </div>
    <p id="scene-note"></p>
  </header>
  <div id="scene-stage">
    <canvas id="scene-canvas"></canvas>
    <!-- d3-annotation explanation overlay: a single callout for the selected
         atom. Sized to the stage via CSS, pointer-events:none so the canvas
         keeps its own hover/click. The bundle renders all text via d3's
         .text() (textContent); labels are untrusted, never innerHTML. -->
    <svg id="scene-annotations" aria-hidden="true"></svg>
    <div id="scene-empty"></div>
    <div id="scene-tooltip"></div>
  </div>
  <!-- Explanation host: the bundle builds the interactive cell view here
       when the package carries a behavior binding. Every string is set with
       textContent. -->
  <main id="explain-root" hidden></main>

<script>
// Reflect the current query in the search box (read-only prefill from the URL;
// .value assignment only, never innerHTML).
(function () {
  try {
    var q = new URLSearchParams(window.location.search).get('q');
    if (q) document.getElementById('scene-q').value = q;
  } catch (e) { /* no-op */ }
})();
</script>

<script>
// The Rust render_scene_html hook replaces the next line with the real
// ScenePackageV2 (serde JSON) before serving. Left null -> honest empty state,
// never fake data. Atom labels are untrusted; the bundle renders all text via
// textContent (never innerHTML).
window.__SCENE_PACKAGE__ = null;
</script>
